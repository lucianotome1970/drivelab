<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" role="img"
     aria-label="How to identify the two ODESC v4.2 variants: the 24 V board has a QC PASS 24V sticker and a purple LED; the 56 V board has a QC PASS 56V sticker and a green LED.">
  <style>
    .board  { fill:#12161f; stroke:#5b6472; stroke-width:2; }
    .silk   { fill:#e8ecf2; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; }
    .sticker{ fill:#f4f6f8; stroke:#9aa4b2; stroke-width:1.5; }
    .stxt   { fill:#12161f; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; }
    .cap    { fill:#c9ced6; stroke:#8b939f; stroke-width:1; }
    .caption{ fill:#8b939f; font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
    .range  { fill:#5b6472; font-family:system-ui,-apple-system,Segoe UI,sans-serif; font-weight:700; }
    .lbl    { font-family:system-ui,-apple-system,Segoe UI,sans-serif; font-weight:700; }
  </style>

  <!-- ============ 24 V ============ -->
  <g transform="translate(20,20)">
    <rect class="board" x="0" y="0" width="300" height="200" rx="10"/>
    <!-- conector de potencia -->
    <rect x="20" y="-8" width="200" height="26" rx="4" fill="#2f7d4f" stroke="#1f5c39" stroke-width="1.5"/>
    <text class="silk" x="150" y="70" font-size="19" text-anchor="middle">ODESC V4.2</text>
    <!-- adesivo QC PASS -->
    <circle class="sticker" cx="70" cy="62" r="27"/>
    <text class="stxt" x="70" y="57" font-size="10" text-anchor="middle">QC PASS</text>
    <line x1="50" y1="63" x2="90" y2="63" stroke="#12161f" stroke-width="1.2"/>
    <text class="stxt" x="70" y="78" font-size="13" text-anchor="middle">24V</text>
    <!-- capacitores -->
    <g>
      <circle class="cap" cx="45"  cy="135" r="22"/>
      <circle class="cap" cx="97"  cy="135" r="22"/>
      <circle class="cap" cx="149" cy="135" r="22"/>
      <circle class="cap" cx="201" cy="135" r="22"/>
      <circle class="cap" cx="253" cy="135" r="22"/>
    </g>
    <!-- LED roxo -->
    <rect x="288" y="126" width="10" height="20" rx="2" fill="#c026d3"/>
    <circle cx="293" cy="136" r="17" fill="#c026d3" opacity="0.28"/>
  </g>
  <text class="lbl" x="336" y="160" font-size="15" fill="#c026d3">LED roxo</text>
  <text class="lbl" x="336" y="180" font-size="15" fill="#c026d3">purple LED</text>
  <text class="range" x="170" y="252" font-size="20" text-anchor="middle">8–24 V</text>
  <text class="caption" x="170" y="274" font-size="13" text-anchor="middle">adesivo 24V · sticker 24V</text>

  <!-- ============ 56 V ============ -->
  <g transform="translate(440,20)">
    <rect class="board" x="0" y="0" width="300" height="200" rx="10"/>
    <rect x="20" y="-8" width="200" height="26" rx="4" fill="#2f7d4f" stroke="#1f5c39" stroke-width="1.5"/>
    <text class="silk" x="150" y="70" font-size="19" text-anchor="middle">ODESC V4.2</text>
    <circle class="sticker" cx="70" cy="62" r="27"/>
    <text class="stxt" x="70" y="57" font-size="10" text-anchor="middle">QC PASS</text>
    <line x1="50" y1="63" x2="90" y2="63" stroke="#12161f" stroke-width="1.2"/>
    <text class="stxt" x="70" y="78" font-size="13" text-anchor="middle">56V</text>
    <g>
      <circle class="cap" cx="45"  cy="135" r="22"/>
      <circle class="cap" cx="97"  cy="135" r="22"/>
      <circle class="cap" cx="149" cy="135" r="22"/>
      <circle class="cap" cx="201" cy="135" r="22"/>
      <circle class="cap" cx="253" cy="135" r="22"/>
    </g>
    <!-- LED verde -->
    <rect x="288" y="126" width="10" height="20" rx="2" fill="#22c55e"/>
    <circle cx="293" cy="136" r="17" fill="#22c55e" opacity="0.28"/>
  </g>
  <text class="lbl" x="756" y="160" font-size="15" fill="#22c55e" text-anchor="end">LED verde</text>
  <text class="lbl" x="756" y="180" font-size="15" fill="#22c55e" text-anchor="end">green LED</text>
  <text class="range" x="590" y="252" font-size="20" text-anchor="middle">8–56 V</text>
  <text class="caption" x="590" y="274" font-size="13" text-anchor="middle">adesivo 56V · sticker 56V</text>

  <!-- nota dos capacitores -->
  <text class="caption" x="380" y="296" font-size="12" text-anchor="middle">
    Os capacitores sao iguais nas duas (63 V) — nao servem para identificar. · Both variants use the same 63 V capacitors.
  </text>
</svg>
