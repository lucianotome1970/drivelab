<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 648" width="940" height="648" role="img" aria-label="Wiring diagram: load cell to INA333 instrumentation amplifier to RP2040-Zero, showing the 1 kohm series resistor, the 100 nF filter capacitor, the REF bias divider and the supply decoupling.">
  <rect x="0" y="0" width="940" height="648" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <text x="24" y="28" font-size="17" font-weight="700" fill="#1b1f24">Load cell → INA333 → RP2040-Zero</text>
    <text x="24" y="47" font-size="12.5" fill="#57606a">The parts in blue are what goes between the boards · As peças em azul são o que vai entre as placas</text>

    <!-- ============ MAIN PANEL ============ -->
    <rect x="16" y="58" width="908" height="330" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5"/>

    <!-- nets -->
    <path d="M174,196 H204 V130 H790" fill="none" stroke="#cf222e" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M174,274 H236 V350 H790" fill="none" stroke="#24292f" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M174,222 H300" fill="none" stroke="#1a7f37" stroke-width="2.2"/>
    <path d="M174,248 H300" fill="none" stroke="#8c959f" stroke-width="2.2"/>

    <text x="612" y="124" font-size="11" fill="#cf222e" font-weight="600">3V3</text>
    <text x="612" y="366" font-size="11" fill="#24292f" font-weight="600">GND</text>

    <!-- wire colour labels -->
    <text x="178" y="190" font-size="11" fill="#cf222e">red / verm.</text>
    <text x="230" y="216" font-size="11" fill="#1a7f37">green / verde</text>
    <text x="230" y="242" font-size="11" fill="#6e7781">white / branco</text>
    <text x="178" y="268" font-size="11" fill="#24292f">black / preto</text>

    <!-- load cell -->
    <text x="109" y="170" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="middle">LOAD CELL / CÉLULA</text>
    <rect x="44" y="178" width="130" height="110" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.8"/>
    <text x="109" y="228" font-size="12" fill="#57606a" text-anchor="middle">bridge / ponte</text>
    <text x="109" y="248" font-size="12" fill="#57606a" text-anchor="middle">2 mV/V</text>

    <!-- INA333 -->
    <rect x="300" y="170" width="190" height="140" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.8"/>
    <text x="395" y="200" font-size="15" font-weight="700" fill="#1b1f24" text-anchor="middle">INA333</text>
    <text x="310" y="226" font-size="12.5" fill="#1b1f24">IN+</text>
    <text x="310" y="252" font-size="12.5" fill="#1b1f24">IN−</text>
    <text x="482" y="239" font-size="12.5" fill="#1b1f24" text-anchor="end">OUT</text>
    <text x="482" y="289" font-size="12.5" fill="#1b1f24" text-anchor="end">REF</text>
    <text x="395" y="290" font-size="11" fill="#57606a" text-anchor="middle">R<tspan font-size="8.5" dy="2">G</tspan><tspan dy="-2"> ≈ 220 Ω → gain ≈ 450</tspan></text>

    <!-- VCC / GND stubs of the module -->
    <path d="M350,170 V130" fill="none" stroke="#cf222e" stroke-width="2.2"/>
    <path d="M350,310 V350" fill="none" stroke="#24292f" stroke-width="2.2"/>
    <circle cx="350" cy="130" r="4" fill="#cf222e"/>
    <circle cx="350" cy="350" r="4" fill="#24292f"/>
    <text x="358" y="160" font-size="11.5" fill="#57606a">VCC</text>
    <text x="358" y="330" font-size="11.5" fill="#57606a">GND</text>

    <!-- REF stub -->
    <path d="M490,285 H532" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <path d="M532,285 l-7,-4 v8 z" fill="#0969da"/>
    <text x="540" y="289" font-size="11" fill="#0969da" font-weight="600">see B</text>

    <!-- signal path: OUT -> 1k -> node -> board -->
    <path d="M490,235 H556" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <rect x="556" y="221" width="56" height="28" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <text x="584" y="240" font-size="12" font-weight="700" fill="#0969da" text-anchor="middle">1 kΩ</text>
    <path d="M612,235 H790" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <circle cx="700" cy="235" r="4" fill="#0969da"/>

    <!-- 100 nF to ground -->
    <path d="M700,235 V279" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <path d="M682,279 H718" fill="none" stroke="#0969da" stroke-width="2.6"/>
    <path d="M682,290 H718" fill="none" stroke="#0969da" stroke-width="2.6"/>
    <path d="M700,290 V350" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <circle cx="700" cy="350" r="4" fill="#24292f"/>
    <text x="726" y="289" font-size="12" font-weight="700" fill="#0969da">100 nF</text>

    <!-- RP2040-Zero -->
    <text x="849" y="96" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="middle">RP2040-Zero</text>
    <rect x="790" y="104" width="118" height="272" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.8"/>
    <text x="800" y="134" font-size="12.5" fill="#1b1f24">3V3</text>
    <text x="800" y="239" font-size="12.5" fill="#1b1f24">26 / 27 / 28</text>
    <text x="800" y="354" font-size="12.5" fill="#1b1f24">GND</text>
    <text x="800" y="256" font-size="10.5" fill="#57606a">(A0 / A1 / A2)</text>

    <!-- ============ PANEL B ============ -->
    <rect x="16" y="404" width="444" height="196" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5"/>
    <text x="32" y="430" font-size="14" font-weight="700" fill="#1b1f24">B · REF bias</text>
    <text x="32" y="449" font-size="11.5" fill="#57606a">Only if your module ties REF to GND.</text>
    <text x="32" y="465" font-size="11.5" fill="#57606a">Só se o seu módulo amarra o REF no GND.</text>

    <path d="M60,510 H100" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <text x="56" y="514" font-size="11.5" font-weight="600" fill="#cf222e" text-anchor="end">3V3</text>
    <rect x="100" y="496" width="56" height="28" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <text x="128" y="515" font-size="12" font-weight="700" fill="#0969da" text-anchor="middle">1 kΩ</text>
    <path d="M156,510 H262" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <circle cx="200" cy="510" r="4" fill="#0969da"/>
    <rect x="262" y="496" width="56" height="28" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <text x="290" y="515" font-size="12" font-weight="700" fill="#0969da" text-anchor="middle">68 Ω</text>
    <path d="M318,510 H360" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <text x="366" y="514" font-size="11.5" font-weight="600" fill="#24292f">GND</text>

    <path d="M200,510 V556" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <path d="M200,556 l-4,-7 h8 z" fill="#0969da"/>
    <text x="210" y="552" font-size="12.5" font-weight="700" fill="#0969da">REF</text>
    <text x="210" y="570" font-size="11" fill="#57606a">0.21 V · ~64 Ω source</text>

    <!-- ============ PANEL C ============ -->
    <rect x="480" y="404" width="444" height="196" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5"/>
    <text x="496" y="430" font-size="14" font-weight="700" fill="#1b1f24">C · Decoupling / Desacoplamento</text>
    <text x="496" y="449" font-size="11.5" fill="#57606a">As close to the chip as it will go.</text>
    <text x="496" y="465" font-size="11.5" fill="#57606a">O mais perto do chip que der.</text>

    <path d="M540,510 H760" fill="none" stroke="#cf222e" stroke-width="2.2"/>
    <text x="534" y="514" font-size="11.5" font-weight="600" fill="#cf222e" text-anchor="end">3V3</text>
    <text x="768" y="514" font-size="11.5" font-weight="600" fill="#1b1f24">VCC (INA333)</text>
    <circle cx="650" cy="510" r="4" fill="#0969da"/>
    <path d="M650,510 V534" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <path d="M632,534 H668" fill="none" stroke="#0969da" stroke-width="2.6"/>
    <path d="M632,545 H668" fill="none" stroke="#0969da" stroke-width="2.6"/>
    <path d="M650,545 V568" fill="none" stroke="#0969da" stroke-width="2.2"/>
    <text x="650" y="584" font-size="11.5" font-weight="600" fill="#24292f" text-anchor="middle">GND</text>
    <text x="678" y="544" font-size="12" font-weight="700" fill="#0969da">100 nF</text>

    <text x="24" y="626" font-size="11" fill="#57606a">Wire colours are the usual convention, not a guarantee — check your cell's datasheet. · As cores dos fios são a convenção comum, não uma garantia — confira o datasheet da sua célula.</text>
  </g>
</svg>
